name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号 (例如 v1.0.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create ZIP package
        run: |
          # 复制需要打包的文件
          mkdir -p release
          cp -r astrbot_plugin_group_utils/ release/
          cp -r 下载jm/ release/
          cp -r 尘白禁区攻略/ release/
          cp README.md release/
          cp LICENSE release/
          
          # 创建zip
          cd release
          zip -r ../snowbreak_QQbot-${{ steps.tag.outputs.tag }}.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: |
            ## Snowbreak QQ Bot ${{ steps.tag.outputs.tag }}
            
            ### 更新内容
            - 在这里添加更新说明
            
            ### 下载
            - `snowbreak_QQbot-${{ steps.tag.outputs.tag }}.zip` - 完整包
            
            ### 安装说明
            参考 [README.md](README.md)
          files: |
            snowbreak_QQbot-${{ steps.tag.outputs.tag }}.zip
          draft: false
          prerelease: false
